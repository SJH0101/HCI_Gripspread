<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif">
  <defs>
    <!-- cup outline in its own frame: rim at y=-70, bottom at y=+70, centred on x=0 -->
    <path id="cupShape" d="M-46,-70 L46,-70 L36,70 L-36,70 Z"/>
    <clipPath id="cupClip"><use href="#cupShape"/></clipPath>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D9622B"/></marker>
    <!-- hand gripping the cup: ring and little finger wrap the front, thumb on the left, index and middle in a V above -->
    <g id="hand">
      <path d="M40,-34 C70,-34 78,-6 70,30 C64,58 44,66 30,62" fill="#F2C9A5" stroke="#B9835E" stroke-width="2"/>
      <rect x="-40" y="0" width="86" height="20" rx="10" fill="#F2C9A5" stroke="#B9835E" stroke-width="2"/>
      <rect x="-36" y="22" width="80" height="18" rx="9" fill="#F2C9A5" stroke="#B9835E" stroke-width="2"/>
      <path d="M-44,-10 C-62,-14 -66,6 -50,12 L-30,12 C-24,4 -30,-8 -44,-10 Z" fill="#F2C9A5" stroke="#B9835E" stroke-width="2"/>
      <path d="M52,-30 L58,-112 Q62,-122 70,-112 L70,-32 Z" fill="#F2C9A5" stroke="#B9835E" stroke-width="2"/>
      <path d="M66,-28 L96,-104 Q104,-112 108,-100 L82,-22 Z" fill="#F2C9A5" stroke="#B9835E" stroke-width="2"/>
    </g>
    <g id="cupUpright">
      <use href="#cupShape" fill="#fff" stroke="#1F2328" stroke-width="2.5"/>
      <rect x="-60" y="-52" width="120" height="130" fill="#8B5E3C" opacity=".85" clip-path="url(#cupClip)"/>
      <use href="#cupShape" fill="none" stroke="#1F2328" stroke-width="2.5"/>
      <use href="#hand"/>
    </g>
  </defs>
  <rect width="960" height="420" fill="#fff"/>

  <!-- 1 rotation wobble -->
  <g transform="translate(160,190)">
    <g transform="rotate(-9)" opacity=".22"><use href="#cupUpright"/></g>
    <g transform="rotate(9)" opacity=".22"><use href="#cupUpright"/></g>
    <use href="#cupUpright"/>
    <path d="M-78,-104 A120,120 0 0 1 78,-104" fill="none" stroke="#D9622B" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>
  </g>
  <text x="160" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2328">회전 떨림</text>
  <text x="160" y="340" text-anchor="middle" font-size="13" fill="#1F2328">각속도 RMS (°/s) · 주 지표</text>
  <text x="160" y="362" text-anchor="middle" font-size="12" fill="#6B7178">컵이 1초에 평균 몇 도씩 까딱이며 도나</text>
  <text x="160" y="380" text-anchor="middle" font-size="12" fill="#6B7178">손가락을 뻗을 때 쥔 손이 끌려가면</text>
  <text x="160" y="398" text-anchor="middle" font-size="12" fill="#6B7178">컵이 같이 돌아가 커진다</text>

  <!-- 2 translation shake -->
  <g transform="translate(480,190)">
    <g transform="translate(-26,0)" opacity=".22"><use href="#cupUpright"/></g>
    <g transform="translate(26,0)" opacity=".22"><use href="#cupUpright"/></g>
    <g>
      <use href="#cupShape" fill="#fff" stroke="#1F2328" stroke-width="2.5"/>
      <!-- sloshing surface: higher on the trailing side -->
      <path d="M-60,-62 L60,-40 L60,80 L-60,80 Z" fill="#8B5E3C" opacity=".85" clip-path="url(#cupClip)"/>
      <use href="#cupShape" fill="none" stroke="#1F2328" stroke-width="2.5"/>
      <use href="#hand"/>
    </g>
    <path d="M-108,-104 L108,-104" stroke="#D9622B" stroke-width="3" marker-start="url(#ah)" marker-end="url(#ah)"/>
  </g>
  <text x="480" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2328">밀리는 떨림</text>
  <text x="480" y="340" text-anchor="middle" font-size="13" fill="#1F2328">선형 가속도 RMS (m/s²) · 보조</text>
  <text x="480" y="362" text-anchor="middle" font-size="12" fill="#6B7178">기울지 않고 옆·앞뒤로 툭툭 밀리는 세기</text>
  <text x="480" y="380" text-anchor="middle" font-size="12" fill="#6B7178">음료가 출렁여 가장자리로 올라온다</text>
  <text x="480" y="398" text-anchor="middle" font-size="12" fill="#6B7178">1 m/s² ≈ 중력의 0.1배</text>

  <!-- 3 tilt and spill angle -->
  <g transform="translate(800,190)">
    <line x1="0" y1="-140" x2="0" y2="96" stroke="#9AA1A9" stroke-dasharray="5 4"/>
    <g transform="rotate(16)">
      <use href="#cupShape" fill="#fff" stroke="#1F2328" stroke-width="2.5"/>
      <!-- liquid stays level in the world frame: counter-rotate the fill -->
      <g clip-path="url(#cupClip)"><g transform="rotate(-16)"><rect x="-120" y="-55" width="240" height="200" fill="#8B5E3C" opacity=".85"/></g></g>
      <use href="#cupShape" fill="none" stroke="#1F2328" stroke-width="2.5"/>
      <use href="#hand"/>
      <line x1="0" y1="-140" x2="0" y2="96" stroke="#D9622B" stroke-width="2"/>
    </g>
    <path d="M0,-120 A120,120 0 0 1 33,-115" fill="none" stroke="#D9622B" stroke-width="3"/>
    <text x="22" y="-128" font-size="16" font-weight="700" fill="#D9622B">θ</text>
  </g>
  <text x="800" y="318" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2328">기울기</text>
  <text x="800" y="340" text-anchor="middle" font-size="13" fill="#1F2328">최대 기울기 변화 θ (°) · H3</text>
  <text x="800" y="362" text-anchor="middle" font-size="12" fill="#6B7178">시작 자세에서 가장 많이 기운 각도</text>
  <text x="800" y="380" text-anchor="middle" font-size="12" fill="#6B7178">넘치는 각도: tan θ = 2 × 남은 높이 ÷ 지름</text>
  <text x="800" y="398" text-anchor="middle" font-size="12" fill="#6B7178">90 mm 컵, 5 mm 남기면 약 6°에서 넘침</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="442" viewBox="0 0 900 442" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect width="900" height="442" fill="#ffffff"/><text x="450.0" y="34.0" font-size="20" fill="#1F2328" text-anchor="middle" font-weight="700">각도 → 벌림 정도 (단위 없음, 0~1)</text><text x="90.0" y="66.0" font-size="15" fill="#1F2328" text-anchor="start" font-weight="700">① 지금 각도 θ</text><line x1="90.0" y1="110.0" x2="810.0" y2="110.0" stroke="#5B6270" stroke-width="2"/><line x1="90.0" y1="105.0" x2="90.0" y2="115.0" stroke="#5B6270" stroke-width="1"/><text x="90.0" y="132.0" font-size="12" fill="#5B6270" text-anchor="middle">0°</text><line x1="162.0" y1="105.0" x2="162.0" y2="115.0" stroke="#5B6270" stroke-width="1"/><text x="162.0" y="132.0" font-size="12" fill="#5B6270" text-anchor="middle">5°</text><line x1="234.0" y1="105.0" x2="234.0" y2="115.0" stroke="#5B6270" stroke-width="1"/><text x="234.0" y="132.0" font-size="12" fill="#5B6270" text-anchor="middle">10°</text><line x1="306.0" y1="105.0" x2="306.0" y2="115.0" stroke="#5B6270" stroke-width="1"/><text x="306.0" y="132.0" font-size="12" fill="#5B6270" text-anchor="middle">15°</text><line x1="378.0" y1="105.0" x2="378.0" y2="115.0" stroke="#5B6270" stroke-width="1"/><text x="378.0" y="132.0" font-size="12" fill="#5B6270" text-anchor="middle">20°</text><line x1="450.0" y1="105.0" x2="450.0" y2="115.0" stroke="#5B6270" stroke-width="1"/><text x="450.0" y="132.0" font-size="12" fill="#5B6270" text-anchor="middle">25°</text><line x1="522.0" y1="105.0" x2="522.0" y2="115.0" stroke="#5B6270" stroke-width="1"/><text x="522.0" y="132.0" font-size="12" fill="#5B6270" text-anchor="middle">30°</text><line x1="594.0" y1="105.0" x2="594.0" y2="115.0" stroke="#5B6270" stroke-width="1"/><text x="594.0" y="132.0" font-size="12" fill="#5B6270" text-anchor="middle">35°</text><line x1="666.0" y1="105.0" x2="666.0" y2="115.0" stroke="#5B6270" stroke-width="1"/><text x="666.0" y="132.0" font-size="12" fill="#5B6270" text-anchor="middle">40°</text><line x1="738.0" y1="105.0" x2="738.0" y2="115.0" stroke="#5B6270" stroke-width="1"/><text x="738.0" y="132.0" font-size="12" fill="#5B6270" text-anchor="middle">45°</text><line x1="810.0" y1="105.0" x2="810.0" y2="115.0" stroke="#5B6270" stroke-width="1"/><text x="810.0" y="132.0" font-size="12" fill="#5B6270" text-anchor="middle">50°</text><rect x="406.8" y="96.0" width="86.4" height="28.0" rx="4" fill="#FDECEA"/><text x="450.0" y="90.0" font-size="13" fill="#E5534B" text-anchor="middle" font-weight="700">데드존 22°~28°</text><circle cx="162.0" cy="110.0" r="7" fill="#E5534B"/><circle cx="450.0" cy="110.0" r="7" fill="#E8833A"/><circle cx="738.0" cy="110.0" r="7" fill="#3B6FE0"/><circle cx="594.0" cy="110.0" r="8" fill="#1F2328"/><text x="594.0" y="90.0" font-size="14" fill="#1F2328" text-anchor="middle" font-weight="700">지금 35°</text><text x="90.0" y="186.0" font-size="15" fill="#1F2328" text-anchor="start" font-weight="700">② 기준점에서 벌어진 비율 e  (각 쪽 범위로 따로 나눔)</text><line x1="162.0" y1="230.0" x2="738.0" y2="230.0" stroke="#5B6270" stroke-width="2"/><line x1="162.0" y1="225.0" x2="162.0" y2="235.0" stroke="#5B6270" stroke-width="1"/><text x="162.0" y="252.0" font-size="12" fill="#5B6270" text-anchor="middle">-1</text><line x1="306.0" y1="225.0" x2="306.0" y2="235.0" stroke="#5B6270" stroke-width="1"/><text x="306.0" y="252.0" font-size="12" fill="#5B6270" text-anchor="middle">-0.5</text><line x1="406.8" y1="225.0" x2="406.8" y2="235.0" stroke="#5B6270" stroke-width="1"/><text x="406.8" y="252.0" font-size="12" fill="#5B6270" text-anchor="middle">-0.15</text><line x1="450.0" y1="225.0" x2="450.0" y2="235.0" stroke="#5B6270" stroke-width="1"/><text x="450.0" y="252.0" font-size="12" fill="#5B6270" text-anchor="middle">0</text><line x1="493.2" y1="225.0" x2="493.2" y2="235.0" stroke="#5B6270" stroke-width="1"/><text x="493.2" y="252.0" font-size="12" fill="#5B6270" text-anchor="middle">0.15</text><line x1="594.0" y1="225.0" x2="594.0" y2="235.0" stroke="#5B6270" stroke-width="1"/><text x="594.0" y="252.0" font-size="12" fill="#5B6270" text-anchor="middle">0.5</text><line x1="738.0" y1="225.0" x2="738.0" y2="235.0" stroke="#5B6270" stroke-width="1"/><text x="738.0" y="252.0" font-size="12" fill="#5B6270" text-anchor="middle">1</text><rect x="406.8" y="216.0" width="86.4" height="28.0" rx="4" fill="#FDECEA"/><text x="594.0" y="210.0" font-size="14" fill="#1F2328" text-anchor="middle" font-weight="700">e = (35 − 25) ÷ (45 − 25) = 0.50</text><circle cx="594.0" cy="230.0" r="8" fill="#1F2328"/><text x="306.0" y="210.0" font-size="13" fill="#E5534B" text-anchor="middle">오므리는 쪽: ÷ (25 − 5)</text><line x1="594.0" y1="140.0" x2="594.0" y2="196.0" stroke="#C9CDD2" stroke-width="1.5" stroke-dasharray="4 4"/><text x="90.0" y="306.0" font-size="15" fill="#1F2328" text-anchor="start" font-weight="700">③ 데드존 빼고 다시 0~1로 늘림 = 벌림 정도</text><line x1="493.2" y1="350.0" x2="738.0" y2="350.0" stroke="#5B6270" stroke-width="2"/><line x1="493.2" y1="345.0" x2="493.2" y2="355.0" stroke="#5B6270" stroke-width="1"/><text x="493.2" y="372.0" font-size="12" fill="#5B6270" text-anchor="middle">0</text><line x1="554.4" y1="345.0" x2="554.4" y2="355.0" stroke="#5B6270" stroke-width="1"/><text x="554.4" y="372.0" font-size="12" fill="#5B6270" text-anchor="middle">0.25</text><line x1="615.6" y1="345.0" x2="615.6" y2="355.0" stroke="#5B6270" stroke-width="1"/><text x="615.6" y="372.0" font-size="12" fill="#5B6270" text-anchor="middle">0.5</text><line x1="676.8" y1="345.0" x2="676.8" y2="355.0" stroke="#5B6270" stroke-width="1"/><text x="676.8" y="372.0" font-size="12" fill="#5B6270" text-anchor="middle">0.75</text><line x1="738.0" y1="345.0" x2="738.0" y2="355.0" stroke="#5B6270" stroke-width="1"/><text x="738.0" y="372.0" font-size="12" fill="#5B6270" text-anchor="middle">1</text><circle cx="594.0" cy="350.0" r="8" fill="#3B6FE0"/><text x="594.0" y="330.0" font-size="14" fill="#3B6FE0" text-anchor="middle" font-weight="700">(0.50 − 0.15) ÷ 0.85 ≈ 0.41</text><line x1="594.0" y1="260.0" x2="594.0" y2="316.0" stroke="#C9CDD2" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="493.2" y1="260.0" x2="493.2" y2="342.0" stroke="#C9CDD2" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="738.0" y1="260.0" x2="738.0" y2="342.0" stroke="#C9CDD2" stroke-width="1.5" stroke-dasharray="4 4"/><text x="90.0" y="420.0" font-size="14" fill="#5B6270" text-anchor="start">· 한쪽 범위가 10°보다 작으면 10°로 침   · e는 −1~1로 자름   · 데드존 = 각 쪽 범위의 15%</text></svg>
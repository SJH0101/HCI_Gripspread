<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
  <rect width="900" height="440" fill="#ffffff"/>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3B6FE0"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#E5534B"/></marker>
  </defs>
  <!-- cards -->
  <rect x="16" y="16" width="276" height="408" rx="16" fill="#F6F7F9"/>
  <rect x="312" y="16" width="276" height="408" rx="16" fill="#F6F7F9"/>
  <rect x="608" y="16" width="276" height="408" rx="16" fill="#F6F7F9"/>
  <text x="154" y="50" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2328">① 손바닥이 옆으로 돔</text>
  <text x="450" y="50" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2328">② 손가락이 접힘</text>
  <text x="746" y="50" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2328">③ 손이 안 보임</text>

  <!-- ===== card 1 ===== -->
  <g>
    <!-- camera -->
    <rect x="132" y="70" width="44" height="28" rx="6" fill="#1F2328"/><circle cx="154" cy="84" r="8" fill="#9AA0A6"/>
    <text x="154" y="116" text-anchor="middle" font-size="13" fill="#5B6270">웹캠</text>
    <!-- facing palm -->
    <rect x="46" y="200" width="90" height="70" rx="14" fill="#FFFFFF" stroke="#1F2328" stroke-width="2"/>
    <line x1="91" y1="198" x2="132" y2="124" stroke="#3B6FE0" stroke-width="3" marker-end="url(#b)"/>
    <text x="91" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#3B6FE0">정면 ✓</text>
    <text x="91" y="312" text-anchor="middle" font-size="13" fill="#5B6270">화살표가 카메라 쪽</text>
    <!-- edge-on palm -->
    <rect x="205" y="196" width="16" height="78" rx="6" fill="#FFFFFF" stroke="#1F2328" stroke-width="2"/>
    <line x1="223" y1="235" x2="272" y2="235" stroke="#E5534B" stroke-width="3" marker-end="url(#r)"/>
    <text x="230" y="292" text-anchor="middle" font-size="14" font-weight="700" fill="#E5534B">옆면 ✗</text>
    <text x="230" y="312" text-anchor="middle" font-size="13" fill="#5B6270">화살표가 옆으로</text>
    <text x="154" y="356" text-anchor="middle" font-size="14" fill="#1F2328">파란 화살표 = 손바닥 법선</text>
    <text x="154" y="380" text-anchor="middle" font-size="14" fill="#1F2328">카메라 축과의 |cos| &lt; 0.35</text>
    <text x="154" y="402" text-anchor="middle" font-size="14" font-weight="700" fill="#E5534B">→ 손가락이 겹쳐 보임, 멈춤</text>
  </g>

  <!-- ===== card 2 ===== -->
  <g>
    <!-- palm base line -->
    <line x1="352" y1="280" x2="548" y2="280" stroke="#C9CDD2" stroke-width="2"/>
    <!-- straight finger -->
    <polyline points="400,280 400,220 400,180 400,145" fill="none" stroke="#1F2328" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.15"/>
    <polyline points="400,280 400,220 400,180 400,145" fill="none" stroke="#3B6FE0" stroke-width="3"/>
    <circle cx="400" cy="280" r="5" fill="#1F2328"/><circle cx="400" cy="220" r="4" fill="#1F2328"/><circle cx="400" cy="180" r="4" fill="#1F2328"/><circle cx="400" cy="145" r="5" fill="#1F2328"/>
    <text x="400" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#3B6FE0">펴짐 ✓</text>
    <text x="400" y="132" text-anchor="middle" font-size="12" fill="#5B6270">길이 김</text>
    <!-- curled finger -->
    <polyline points="500,280 500,225 530,205 538,230" fill="none" stroke="#1F2328" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.15"/>
    <polyline points="500,280 500,225 530,205 538,230" fill="none" stroke="#E5534B" stroke-width="3"/>
    <circle cx="500" cy="280" r="5" fill="#1F2328"/><circle cx="500" cy="225" r="4" fill="#1F2328"/><circle cx="530" cy="205" r="4" fill="#1F2328"/><circle cx="538" cy="230" r="5" fill="#1F2328"/>
    <line x1="500" y1="280" x2="538" y2="230" stroke="#E5534B" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="510" y="304" text-anchor="middle" font-size="14" font-weight="700" fill="#E5534B">접힘 ✗</text>
    <text x="514" y="192" text-anchor="middle" font-size="12" fill="#5B6270">마디가 꺾임</text>
    <text x="450" y="340" text-anchor="middle" font-size="14" fill="#1F2328">펴짐 비율 = 뿌리→끝 길이 ÷ 손바닥 길이</text>
    <text x="450" y="362" text-anchor="middle" font-size="14" fill="#1F2328">0.55 미만 또는 마디 굽힘 합 80° 초과</text>
    <text x="450" y="384" text-anchor="middle" font-size="14" fill="#1F2328">6프레임(약 0.1초) 연속이면</text>
    <text x="450" y="406" text-anchor="middle" font-size="14" font-weight="700" fill="#E5534B">→ 컵을 감싸 쥠, 멈춤</text>
  </g>

  <!-- ===== card 3 ===== -->
  <g>
    <rect x="666" y="80" width="160" height="120" rx="8" fill="#FFFFFF" stroke="#1F2328" stroke-width="2"/>
    <path d="M716,195 L716,150 Q716,142 724,142 Q732,142 732,150 L732,120 Q732,112 740,112 Q748,112 748,120 L748,150 L756,124 Q759,116 766,119 Q772,122 770,130 L762,160 Q776,150 782,158 Q786,164 778,172 L760,195 Z" fill="none" stroke="#9AA0A6" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="746" y="226" text-anchor="middle" font-size="13" fill="#5B6270">화면에서 손이 사라짐</text>
    <text x="746" y="262" text-anchor="middle" font-size="22" font-weight="700" fill="#E5534B">0.5초 ↑</text>
    <text x="746" y="300" text-anchor="middle" font-size="14" fill="#1F2328">처음 상태로 돌아감</text>
    <text x="746" y="340" text-anchor="middle" font-size="14" fill="#1F2328">다시 손을 올리고</text>
    <text x="746" y="362" text-anchor="middle" font-size="14" fill="#1F2328">편한 V로 0.7초 멈춰야 켜짐</text>
    <text x="746" y="400" text-anchor="middle" font-size="14" font-weight="700" fill="#3B6FE0">→ 손 올리다 갑자기 스크롤 안 됨</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="900" height="486" viewBox="0 0 900 486" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif"><rect width="900" height="486" fill="#ffffff"/><text x="450.0" y="34.0" font-size="20" fill="#1F2328" text-anchor="middle" font-weight="700">손 범위 재기 (처음 한 번)  →  편한 V 잡기 (쓸 때마다)</text><text x="60.0" y="76.0" font-size="16" fill="#1F2328" text-anchor="start" font-weight="700">① 최대로 벌려</text><rect x="60.0" y="84.0" width="240.0" height="34.0" rx="6" fill="#C9CDD2"/><text x="180.0" y="106.0" font-size="14" fill="#1F2328" text-anchor="middle">카운트다운 3초</text><rect x="304.0" y="84.0" width="120.0" height="34.0" rx="6" fill="#3B6FE0"/><text x="364.0" y="106.0" font-size="14" fill="#ffffff" text-anchor="middle">측정 1.5초</text><text x="442.0" y="106.0" font-size="15" fill="#3B6FE0" text-anchor="start" font-weight="700">상위 10% 지점 → 최대 벌림</text><text x="60.0" y="154.0" font-size="16" fill="#1F2328" text-anchor="start" font-weight="700">② 최대로 오므려</text><rect x="60.0" y="162.0" width="240.0" height="34.0" rx="6" fill="#C9CDD2"/><text x="180.0" y="184.0" font-size="14" fill="#1F2328" text-anchor="middle">카운트다운 3초</text><rect x="304.0" y="162.0" width="120.0" height="34.0" rx="6" fill="#3B6FE0"/><text x="364.0" y="184.0" font-size="14" fill="#ffffff" text-anchor="middle">측정 1.5초</text><text x="442.0" y="184.0" font-size="15" fill="#3B6FE0" text-anchor="start" font-weight="700">하위 10% 지점 → 최대 오므림</text><text x="60.0" y="244.0" font-size="14" fill="#5B6270" text-anchor="start">범위가 8°보다 좁으면 다시 잼 · 결과는 브라우저에 저장 · 쓰다가 범위 밖으로 가면 자동으로 넓어짐</text><text x="60.0" y="288.0" font-size="16" fill="#1F2328" text-anchor="start" font-weight="700">③ 편한 V로 멈춤</text><rect x="60.0" y="296.0" width="56.0" height="34.0" rx="6" fill="#E8833A"/><text x="88.0" y="318.0" font-size="14" fill="#ffffff" text-anchor="middle">0.7초</text><text x="130.0" y="318.0" font-size="15" fill="#E8833A" text-anchor="start" font-weight="700">흔들림 2.5° 이하로 버티면 그동안 평균 각도 → 중립(편한 V), 삑 하고 켜짐</text><text x="60.0" y="356.0" font-size="14" fill="#5B6270" text-anchor="start">중간에 2.5° 넘게 흔들리면 0.7초를 처음부터 다시 셈</text><text x="60.0" y="392.0" font-size="16" fill="#1F2328" text-anchor="start" font-weight="700">예시 사람</text><line x1="110.0" y1="436.0" x2="790.0" y2="436.0" stroke="#5B6270" stroke-width="2"/><line x1="110.0" y1="431.0" x2="110.0" y2="441.0" stroke="#5B6270" stroke-width="1"/><text x="110.0" y="460.0" font-size="12" fill="#5B6270" text-anchor="middle">0°</text><line x1="178.0" y1="431.0" x2="178.0" y2="441.0" stroke="#5B6270" stroke-width="1"/><text x="178.0" y="460.0" font-size="12" fill="#5B6270" text-anchor="middle">5°</text><line x1="246.0" y1="431.0" x2="246.0" y2="441.0" stroke="#5B6270" stroke-width="1"/><text x="246.0" y="460.0" font-size="12" fill="#5B6270" text-anchor="middle">10°</text><line x1="314.0" y1="431.0" x2="314.0" y2="441.0" stroke="#5B6270" stroke-width="1"/><text x="314.0" y="460.0" font-size="12" fill="#5B6270" text-anchor="middle">15°</text><line x1="382.0" y1="431.0" x2="382.0" y2="441.0" stroke="#5B6270" stroke-width="1"/><text x="382.0" y="460.0" font-size="12" fill="#5B6270" text-anchor="middle">20°</text><line x1="450.0" y1="431.0" x2="450.0" y2="441.0" stroke="#5B6270" stroke-width="1"/><text x="450.0" y="460.0" font-size="12" fill="#5B6270" text-anchor="middle">25°</text><line x1="518.0" y1="431.0" x2="518.0" y2="441.0" stroke="#5B6270" stroke-width="1"/><text x="518.0" y="460.0" font-size="12" fill="#5B6270" text-anchor="middle">30°</text><line x1="586.0" y1="431.0" x2="586.0" y2="441.0" stroke="#5B6270" stroke-width="1"/><text x="586.0" y="460.0" font-size="12" fill="#5B6270" text-anchor="middle">35°</text><line x1="654.0" y1="431.0" x2="654.0" y2="441.0" stroke="#5B6270" stroke-width="1"/><text x="654.0" y="460.0" font-size="12" fill="#5B6270" text-anchor="middle">40°</text><line x1="722.0" y1="431.0" x2="722.0" y2="441.0" stroke="#5B6270" stroke-width="1"/><text x="722.0" y="460.0" font-size="12" fill="#5B6270" text-anchor="middle">45°</text><line x1="790.0" y1="431.0" x2="790.0" y2="441.0" stroke="#5B6270" stroke-width="1"/><text x="790.0" y="460.0" font-size="12" fill="#5B6270" text-anchor="middle">50°</text><circle cx="178.0" cy="436.0" r="8" fill="#E5534B"/><text x="178.0" y="420.0" font-size="14" fill="#E5534B" text-anchor="middle" font-weight="700">최대 오므림 5°</text><circle cx="450.0" cy="436.0" r="8" fill="#E8833A"/><text x="450.0" y="420.0" font-size="14" fill="#E8833A" text-anchor="middle" font-weight="700">중립 25°</text><circle cx="722.0" cy="436.0" r="8" fill="#3B6FE0"/><text x="722.0" y="420.0" font-size="14" fill="#3B6FE0" text-anchor="middle" font-weight="700">최대 벌림 45°</text></svg>